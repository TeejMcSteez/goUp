services:
  goup:
    build: .
    image: ghcr.io/teejmcsteez/goup:latest
    container_name: goup
    restart: unless-stopped
    ports:
      - "8101:8101"
    volumes:
      - goup-config:/app/config
      - goup-data:/app/data
    # Optional: set timezone for accurate timestamps
    environment:
      - TZ=America/New_York

volumes:
  goup-config:
  goup-data:
