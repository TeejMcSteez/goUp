# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.x'
    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        version: '9.x'

    - name: Install Node Modules && Build static assets
      run: cd goupfrontend && pnpm i && pnpm build

    - name: Build
      run: go build -v ./...

    - name: Upload static assets
      uses: actions/upload-artifact@v4
      with:
        name: static-assets
        path: server/static

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.x'

    - name: Download static assets
      uses: actions/download-artifact@v4
      with:
        name: static-assets
        path: server/static

    - name: Build release binaries
      run: |
        mkdir release
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o release/goup-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o release/goup-linux-arm64 .
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o release/goup-windows-amd64.exe .
        GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o release/goup-windows-arm64.exe .

    - name: Archive release binaries
      run: |
        cd release
        tar -czvf goup-linux-amd64.tar.gz goup-linux-amd64
        tar -czvf goup-linux-arm64.tar.gz goup-linux-arm64
        zip goup-windows-amd64.zip goup-windows-amd64.exe
        zip goup-windows-arm64.zip goup-windows-arm64.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/goup-linux-amd64.tar.gz
          release/goup-linux-arm64.tar.gz
          release/goup-windows-amd64.zip
          release/goup-windows-arm64.zip
