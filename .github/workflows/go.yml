# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Build and Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        version: '9.x'
    - name: Get pnpm store directory
      id: pnpm-cache
      run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT
    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-
    - name: Install Node Modules && Build static assets
      run: cd frontend && pnpm i && pnpm build
    - name: Run Go tests
      run: go test -v ./...
    - name: Test build
      run: go build -v ./...
    - name: Upload static assets
      uses: actions/upload-artifact@v4
      with:
        name: static-assets
        path: server/static

  release:
    name: Release Build
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
    - name: Download static assets
      uses: actions/download-artifact@v4
      with:
        name: static-assets
        path: server/static
    - name: Cross-compile and Package
      run: |
        mkdir -p dist
        declare -a TARGETS=("linux/amd64" "linux/arm64" "windows/amd64" "windows/arm64" "darwin/amd64" "darwin/arm64")

        for TARGET in "${TARGETS[@]}"; do
          IFS='/' read -r GOOS GOARCH <<< "$TARGET"
          echo "Building for $GOOS/$GOARCH..."

          OUTPUT_NAME="goup-${GOOS}-${GOARCH}"
          BIN_DIR="dist"
          BIN_PATH="$BIN_DIR/$OUTPUT_NAME"
          ARCHIVE_PATH="$BIN_DIR/$OUTPUT_NAME"

          if [ "$GOOS" = "windows" ]; then
            BIN_PATH="${BIN_PATH}.exe"
            ARCHIVE_PATH="${ARCHIVE_PATH}.zip"
            env GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$BIN_PATH" .
            zip -j "$ARCHIVE_PATH" "$BIN_PATH"
          else
            ARCHIVE_PATH="${ARCHIVE_PATH}.tar.gz"
            env GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$BIN_PATH" .
            tar -czvf "$ARCHIVE_PATH" -C "$BIN_DIR" "$(basename "$BIN_PATH")"
          fi
          echo "Created $ARCHIVE_PATH"
        done
    - name: Upload all release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-release-artifacts
        path: dist/*

  create-release:
    name: Create Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-release-artifacts
        path: release-artifacts
    - name: List downloaded files
      run: ls -R release-artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*

  docker:
    name: Docker Build & Push
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download static assets
      uses: actions/download-artifact@v4
      with:
        name: static-assets
        path: server/static

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version tag
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
