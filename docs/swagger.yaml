basePath: /
definitions:
  server.BackoffPayload:
    properties:
      backoff_period:
        type: string
    type: object
  server.DatabaseSizePayload:
    properties:
      db_max_size:
        type: string
    type: object
  server.ServiceUpdatePayload:
    properties:
      old_name:
        type: string
      service:
        $ref: '#/definitions/utils.Service'
    type: object
  utils.AverageData:
    properties:
      average:
        type: number
      name:
        type: string
    type: object
  utils.ConfigData:
    properties:
      backoff_period:
        type: string
      discord:
        $ref: '#/definitions/utils.DiscordTrigger'
      gotify:
        $ref: '#/definitions/utils.GotifyTrigger'
      ha:
        $ref: '#/definitions/utils.HATrigger'
      mqtt:
        $ref: '#/definitions/utils.MQTTTrigger'
      services:
        additionalProperties:
          $ref: '#/definitions/utils.Service'
        type: object
      slack:
        $ref: '#/definitions/utils.SlackTrigger'
      smtp:
        $ref: '#/definitions/utils.SMTPTrigger'
      telegram:
        $ref: '#/definitions/utils.TelegramTrigger'
      webhook:
        $ref: '#/definitions/utils.WebhookTrigger'
    type: object
  utils.DatabaseSizePayload:
    properties:
      size_string:
        type: integer
    type: object
  utils.DiscordTrigger:
    properties:
      backoff_Period:
        type: string
      discord_Auth:
        description: Can be Bot <token> or Bearer <token>
        type: string
      discord_Channel:
        description: |-
          For now only one channel is supported
          However, if needed many channels would be optional
          Just need to use a string array over string pointer to send message to all channels
        type: string
    type: object
  utils.GotifyTrigger:
    properties:
      backoff_Period:
        type: string
      gotify_Application:
        type: string
      gotify_Priority:
        type: integer
      gotify_Server:
        type: string
      gotify_Title:
        type: string
      gotify_Token:
        type: string
    type: object
  utils.HATrigger:
    properties:
      backoff_Period:
        type: string
      ha_Token:
        type: string
      ha_URL:
        type: string
    type: object
  utils.MQTTTrigger:
    properties:
      backoff_Period:
        type: string
      mqtt_broker:
        type: string
      mqtt_key:
        type: string
      mqtt_username:
        type: string
    type: object
  utils.SMTPTrigger:
    properties:
      app_Password:
        type: string
      backoff_Period:
        type: string
      email:
        type: string
      smtpserver:
        type: string
    type: object
  utils.ScheduleState:
    properties:
      interval:
        type: string
      timespan:
        type: integer
    type: object
  utils.Service:
    properties:
      API_KEY:
        type: string
      API_URL:
        type: string
      Active:
        description: |-
          Active is a *bool so an unset value (nil) can default to true,
          distinct from an explicit `active: false`.
        type: boolean
      Description:
        type: string
      Name:
        type: string
      Retry_Requests:
        type: integer
      URL:
        type: string
      Valid_Responses:
        items:
          type: string
        type: array
    type: object
  utils.ServiceData:
    properties:
      active:
        type: boolean
      data:
        type: string
      description:
        type: string
      error:
        type: boolean
      name:
        type: string
      response:
        type: string
      response_time:
        type: string
      timestamp:
        type: string
      url:
        type: string
    type: object
  utils.ServiceResponse:
    properties:
      downed_services:
        items:
          $ref: '#/definitions/utils.ServiceData'
        type: array
      services:
        items:
          $ref: '#/definitions/utils.ServiceData'
        type: array
    type: object
  utils.ServiceResponseTime:
    properties:
      response_time:
        type: string
      service_data:
        $ref: '#/definitions/utils.ServiceData'
    type: object
  utils.SlackTrigger:
    properties:
      backoff_Period:
        type: string
      bot_Username:
        type: string
      slack_Channel:
        type: string
      slack_Token:
        type: string
    type: object
  utils.TelegramTrigger:
    properties:
      backoff_Period:
        type: string
      telegram_Channel_Id:
        type: string
      telegram_Token:
        type: string
    type: object
  utils.WebhookTrigger:
    properties:
      backoff_Period:
        type: string
      custom_message:
        type: string
      webhook_key_string:
        description: |-
          Can use any authorization header string
          Ex: Basic <creds>/Digest username=<username>.../Bearer <token_string>
        type: string
      webhook_url:
        type: string
    type: object
host: localhost:8101
info:
  contact: {}
  description: REST API for monitoring service uptime, response times, and managing
    configuration.
  title: goUp API
  version: "1.0"
paths:
  /api:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/utils.ServiceData'
            type: array
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get all recent service data
      tags:
      - data
  /api/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.ConfigData'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get full configuration
      tags:
      - config
  /api/config/backoff:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.BackoffPayload'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get the global trigger backoff period
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Backoff duration, e.g. 5m; blank disables the global backoff
        in: body
        name: backoff
        required: true
        schema:
          $ref: '#/definitions/server.BackoffPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set the global trigger backoff period
      tags:
      - config
  /api/config/discord:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove Discord trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Discord config
        in: body
        name: discord
        required: true
        schema:
          $ref: '#/definitions/utils.DiscordTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set Discord trigger configuration
      tags:
      - config
  /api/config/gotify:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove Gotify trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Gotify config
        in: body
        name: gotify
        required: true
        schema:
          $ref: '#/definitions/utils.GotifyTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set Gotify trigger configuration
      tags:
      - config
  /api/config/ha:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove Home Assistant trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Home Assistant config
        in: body
        name: ha
        required: true
        schema:
          $ref: '#/definitions/utils.HATrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set Home Assistant trigger configuration
      tags:
      - config
  /api/config/mqtt:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove MQTT trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: MQTT config
        in: body
        name: mqtt
        required: true
        schema:
          $ref: '#/definitions/utils.MQTTTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set MQTT trigger configuration
      tags:
      - config
  /api/config/service:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Service definition
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/utils.Service'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete a monitored service
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Service definition
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/utils.Service'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "409":
          description: conflict
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Add a monitored service
      tags:
      - config
    put:
      consumes:
      - application/json
      parameters:
      - description: Old name + new service definition
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.ServiceUpdatePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update a monitored service
      tags:
      - config
  /api/config/service/active:
    get:
      parameters:
      - description: Service name to look up
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Service'
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get a service's active (fetch enabled) state
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Service to toggle active state
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/utils.Service'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Enable or disable fetch for a service
      tags:
      - config
  /api/config/size:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.DatabaseSizePayload'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get the configured database max size
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Size string (e.g. 1kb, 2mb, 3gb)
        in: body
        name: db_max_size
        required: true
        schema:
          $ref: '#/definitions/server.DatabaseSizePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update the database max size
      tags:
      - config
  /api/config/slack:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove Slack trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Slack config
        in: body
        name: slack
        required: true
        schema:
          $ref: '#/definitions/utils.SlackTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set Slack trigger configuration
      tags:
      - config
  /api/config/smtp:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove SMTP trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: SMTP config
        in: body
        name: smtp
        required: true
        schema:
          $ref: '#/definitions/utils.SMTPTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set SMTP trigger configuration
      tags:
      - config
  /api/config/telegram:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove Telegram trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Telegram config
        in: body
        name: telegram
        required: true
        schema:
          $ref: '#/definitions/utils.TelegramTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set Telegram trigger configuration
      tags:
      - config
  /api/config/webhook:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove webhook trigger configuration
      tags:
      - config
    post:
      consumes:
      - application/json
      parameters:
      - description: Webhook config
        in: body
        name: webhook
        required: true
        schema:
          $ref: '#/definitions/utils.WebhookTrigger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Set webhook trigger configuration
      tags:
      - config
  /api/db/clear:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: internal server error
          schema:
            type: string
      summary: Clear all data from the database
      tags:
      - database
  /api/db/persist:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: persistence enabled
          schema:
            type: boolean
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get whether database persistence is enabled
      tags:
      - database
    post:
      produces:
      - application/json
      responses:
        "200":
          description: empty body
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Toggle database persistence
      tags:
      - database
  /api/db/size:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.DatabaseSizePayload'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get database file size in bytes for regular files; system-dependent
        for others https://pkg.go.dev/io/fs#FileInfo.Size
      tags:
      - database
  /api/errors:
    get:
      parameters:
      - description: Max number of results (0 = all)
        in: query
        name: limit
        type: integer
      - description: Sort order (asc or desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/utils.ServiceData'
            type: array
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get error log entries
      tags:
      - data
  /api/rt:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/utils.ServiceResponseTime'
            type: array
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get response time history for all services
      tags:
      - data
  /api/schedule:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.ScheduleState'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get the polling schedule
      tags:
      - schedule
    post:
      consumes:
      - application/json
      parameters:
      - description: Schedule to set
        in: body
        name: schedule
        required: true
        schema:
          $ref: '#/definitions/utils.ScheduleState'
      produces:
      - application/json
      responses:
        "200":
          description: '{updated:true}'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update the polling schedule
      tags:
      - schedule
  /api/status:
    get:
      description: Returns all currently down services.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.ServiceResponse'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get current service status returning any downed services or null for
        no services down
      tags:
      - data
  /api/uptime:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/utils.AverageData'
            type: array
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get uptime averages for all services
      tags:
      - data
schemes:
- http
swagger: "2.0"
