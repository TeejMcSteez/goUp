basePath: /
definitions:
  server.DatabaseSizePayload:
    properties:
      db_max_size:
        type: string
    type: object
  server.ServiceUpdatePayload:
    properties:
      old_name:
        type: string
      service:
        $ref: '#/definitions/utils.Service'
    type: object
  utils.AverageData:
    properties:
      average:
        type: number
      name:
        type: string
    type: object
  utils.ConfigData:
    properties:
      discord:
        $ref: '#/definitions/utils.DiscordTrigger'
      gotify:
        $ref: '#/definitions/utils.GotifyTrigger'
      ha:
        $ref: '#/definitions/utils.HATrigger'
      mqtt:
        $ref: '#/definitions/utils.MQTTTrigger'
      services:
        additionalProperties:
          $ref: '#/definitions/utils.Service'
        type: object
      slack:
        $ref: '#/definitions/utils.SlackTrigger'
      smtp:
        $ref: '#/definitions/utils.SMTPTrigger'
      telegram:
        $ref: '#/definitions/utils.TelegramTrigger'
      webhook:
        $ref: '#/definitions/utils.WebhookTrigger'
    type: object
  utils.DatabaseSizePayload:
    properties:
      size_string:
        type: integer
    type: object
  utils.DiscordTrigger:
    properties:
      discord_Auth:
        description: Can be Bot <token> or Bearer <token>
        type: string
      discord_Channel:
        description: |-
          For now only one channel is supported
          However, if needed many channels would be optional
          Just need to use a string array over string pointer to send message to all channels
        type: string
    type: object
  utils.GotifyTrigger:
    properties:
      gotify_Application:
        type: string
      gotify_Priority:
        type: integer
      gotify_Server:
        type: string
      gotify_Title:
        type: string
      gotify_Token:
        type: string
    type: object
  utils.HATrigger:
    properties:
      ha_Token:
        type: string
      ha_URL:
        type: string
    type: object
  utils.MQTTTrigger:
    properties:
      mqtt_broker:
        type: string
      mqtt_key:
        type: string
      mqtt_username:
        type: string
    type: object
  utils.SMTPTrigger:
    properties:
      app_Password:
        type: string
      email:
        type: string
      smtpserver:
        type: string
    type: object
  utils.ScheduleState:
    properties:
      interval:
        type: string
      timespan:
        type: integer
    type: object
  utils.Service:
    properties:
      api_KEY:
        type: string
      api_URL:
        type: string
      description:
        type: string
      name:
        type: string
      retry_Requests:
        type: integer
      url:
        type: string
      valid_Responses:
        items:
          type: string
        type: array
    type: object
  utils.ServiceData:
    properties:
      data:
        type: string
      description:
        type: string
      error:
        type: boolean
      name:
        type: string
      response:
        type: string
      response_time:
        type: string
      timestamp:
        type: string
      url:
        type: string
    type: object
  utils.ServiceResponse:
    properties:
      downed_services:
        items:
          $ref: '#/definitions/utils.ServiceData'
        type: array
      services:
        items:
          $ref: '#/definitions/utils.ServiceData'
        type: array
    type: object
  utils.ServiceResponseTime:
    properties:
      response_time:
        type: string
      service_data:
        $ref: '#/definitions/utils.ServiceData'
    type: object
  utils.SlackTrigger:
    properties:
      bot_Username:
        type: string
      slack_Channel:
        type: string
      slack_Token:
        type: string
    type: object
  utils.TelegramTrigger:
    properties:
      telegram_Channel_Id:
        type: string
      telegram_Token:
        type: string
    type: object
  utils.WebhookTrigger:
    properties:
      custom_message:
        type: string
      webhook_key_string:
        description: |-
          Can use any authorization header string
          Ex: Basic <creds>/Digest username=<username>.../Bearer <token_string>
        type: string
      webhook_url:
        type: string
    type: object
host: localhost:8101
info:
  contact: {}
  description: REST API for monitoring service uptime, response times, and managing
    configuration.
  title: goUp API
  version: "1.0"
